<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso WordPress y ERP</title>
<meta name="theme-color" content="#12141a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concepto: panel de estudio oscuro, tarjetas sobrias, acento azul lavanda y titular serif */
:root {
  --bg: #12141a;
  --surface: #1a1d26;
  --surface2: #14161d;
  --fg: #f1f3f8;
  --muted: #8e94a8;
  --line: #2a2e3b;
  --accent: #8b97ff;
  --on-accent: #12141a;
  --ok: #5fd39a;
  --ok-soft: #14301f;
  --bad: #ff8b82;
  --bad-soft: #3a1a1f;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
#root { display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.4rem); line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font: 700 1.05rem var(--font-body); margin: 0; }
.top { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: space-between; align-items: flex-start; }
.sub { color: var(--muted); margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.meta, .hint { color: var(--muted); font-size: 0.9rem; margin: 0; }
button { font-family: inherit; }
button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.seg { display: inline-flex; max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 9px 14px; font: 500 0.92rem var(--font-body); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button:disabled { color: var(--muted); opacity: .45; cursor: not-allowed; }
.pills { display: flex; flex-wrap: wrap; gap: 10px; }
.pill { border: 1.5px solid var(--accent); background: transparent; color: var(--fg); padding: 8px 16px; border-radius: 999px; font: 500 0.92rem var(--font-body); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.btn { border: 0; background: var(--accent); color: var(--on-accent); font: 700 1.05rem var(--font-body); padding: 14px 28px; border-radius: 12px; cursor: pointer; align-self: flex-start; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.good { background: var(--ok); color: var(--on-accent); }
.btn.warn { background: var(--bad); color: var(--on-accent); }
.btn.small { padding: 8px 14px; font-size: 0.88rem; border-radius: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.link { border: 0; background: none; color: var(--muted); font: 500 0.92rem var(--font-body); cursor: pointer; padding: 4px 0; }
.link:hover { color: var(--fg); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat small { color: var(--muted); font-size: 0.82rem; }
.stat b { font: 600 1.5rem var(--font-body); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.8rem; }
.units { display: flex; flex-direction: column; }
.urow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 40px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.urow:first-child { border-top: 0; }
.urow span { min-width: 0; overflow-wrap: anywhere; }
.urow em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.bar { display: block; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
@media (max-width: 480px) { .urow { grid-template-columns: minmax(0, 1fr) 70px 36px; gap: 8px; } .card { padding: 16px; } }

details.card summary { cursor: pointer; font-weight: 700; }
.expl { display: flex; flex-direction: column; gap: 10px; color: var(--muted); font-size: 0.92rem; }
.expl p { margin: 0; }
.expl b { color: var(--fg); }
.foot { text-align: center; color: var(--muted); font-size: 0.82rem; margin: 4px 0 0; }

.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tgt { stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .ln { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .pt.ok { fill: var(--ok); }
.chart text { fill: var(--muted); font: 11px var(--font-body); }
.chart text.tl { fill: var(--ok); font-weight: 600; }
.chart text.val { fill: var(--fg); font-weight: 600; font-size: 12px; }

.topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--muted); font-size: 0.9rem; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-top { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { align-self: flex-start; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 2px 9px; border-radius: 99px; }
.q { font: 600 1.15rem/1.4 var(--font-body); margin: 0; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface2); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 400 1rem/1.4 var(--font-body); cursor: pointer; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 0.8rem var(--font-body); color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .l { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .l { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.opt.sel { border-color: var(--accent); }
.opt.sel .l { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fb { border-radius: 12px; padding: 12px 14px; font-size: 0.93rem; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb strong { display: block; margin-bottom: 2px; }
.fb p { margin: 0; color: var(--fg); }
textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--surface2); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: 400 1rem/1.5 var(--font-body); }
.model { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface2); }
.model h3 { margin: 0; font: 600 0.78rem var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.model p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.85rem; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.hit { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.score { font: 400 3.2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; overflow-wrap: anywhere; }
.review b { display: block; margin-bottom: 4px; }
.review small { display: block; color: var(--ok); font-weight: 500; }
.review small.no { color: var(--bad); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
</head>

</div>

/* ---------- Guardado: cuenta (db), navegador o memoria ---------- */
const Store = {sessions:[], q:{}, kind:'mem', ref:null, ready:false, err:false, confirmDel:false};
let chain = Promise.resolve();
function persist(){
  chain = chain.then(async () => {
    try{
      if(Store.kind === 'db') await Store.ref.set({sessions: Store.sessions, q: Store.q});
      else if(Store.kind === 'local') localStorage.setItem('rep_v3', JSON.stringify({sessions: Store.sessions, q: Store.q}));
      Store.err = false;
    }catch(e){
      if(Store.kind === 'db'){
        Store.kind = 'local';
        try{ localStorage.setItem('rep_v3', JSON.stringify({sessions: Store.sessions, q: Store.q})); Store.err = false; }
        catch(e2){ Store.kind = 'mem'; Store.err = true; }
      } else Store.err = true;
      if(!RUN) render();
    }
  });
}
async function initStore(){
  try{
    if(window.claude && window.claude.use){
      const db = await claude.use('db'), user = await claude.use('user');
      const id = user ? await user.id() : null;
      if(db && id){
        Store.ref = db.doc('data/users/' + id + '/profile');
        const snap = await Store.ref.get();
        if(snap.exists){ const d = snap.data(); Store.sessions = Array.isArray(d.sessions) ? d.sessions.slice() : []; Store.q = d.q && typeof d.q === 'object' ? Object.assign({}, d.q) : {}; }
        Store.kind = 'db';
      }
    }
  }catch(e){ Store.kind = 'mem'; }
  if(Store.kind !== 'db'){
    try{ const d = JSON.parse(localStorage.getItem('rep_v3') || '{}'); Store.sessions = d.sessions || []; Store.q = d.q || {}; Store.kind = 'local'; }
    catch(e){ Store.kind = 'mem'; Store.sessions = []; Store.q = {}; }
  }
  Store.ready = true;
  render();
}

const poolOf = (s,t) => (t === 'abc' ? ABC : DEV).filter(x => x.t === s);
const pOf = x => Store.q[x.id] ? Store.q[x.id].p : PRIOR;
function projection(s){
  const pool = poolOf(s,'abc'), mean = avg(pool.map(pOf)), k = Math.min(EXAM_N, pool.length), gap = 1 - mean;
  const need = T => gap <= (1-T) + 1e-9 ? 0 : Math.ceil(Math.log2(gap/(1-T)));
  return {mean, score: mean*10, p10: Math.pow(mean,k), seenN: pool.filter(x => Store.q[x.id]).length, total: pool.length, k,
          r95: need(GOAL/10), r10: need(Math.pow(0.5, 1/k))};
}
function secPer(s,t){
  const ss = Store.sessions.filter(x => x.subj === s && x.tipo === t && x.n > 0);
  const n = ss.reduce((a,x)=>a+x.n,0), sec = ss.reduce((a,x)=>a+x.sec,0);
  if(n < 5) return t === 'abc' ? 15 : 60;
  return Math.max(5, Math.min(120, Math.round(sec/n)));
}

/* ---------- Estado de la interfaz ---------- */
const UI = {subj:'wp', tipo:'abc', mode:'all', units:{wp:[1,2,3], erp:[1,2,3,4]}, detOpen:false};
let RUN = null;
const root = document.getElementById('root');

const seg = (act, items, cur) => `<div class="seg" role="group">${items.map(([v,l,dis]) =>
  `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur===v}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`;

function chartSvg(scores){
  const W = 640, H = 280, L = 40, R = 16, T = 18, B = 30, pw = W-L-R, ph = H-T-B, N = scores.length;
  const X = i => N === 1 ? L + pw/2 : L + 20 + (pw-40)*i/(N-1);
  const Y = v => T + ph*(1 - v/10);
  let g = '';
  [0,2,4,6,8,10].forEach(v => { g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`; });
  g += `<line class="tgt" x1="${L}" x2="${W-R}" y1="${Y(GOAL)}" y2="${Y(GOAL)}"/><text class="tl" x="${L+6}" y="${Y(GOAL)+15}">Objetivo ${fmt(GOAL)}</text>`;
  let body = '';
  if(!N){
    body = `<text x="${W/2}" y="${H/2}" text-anchor="middle">Aún no hay rondas de ${MIN_Q} o más preguntas</text>`;
  } else {
    const step = Math.ceil(N/12);
    body += `<polyline class="ln" points="${scores.map((s,i)=>X(i)+','+Y(s)).join(' ')}"/>`;
    scores.forEach((s,i) => {
      body += `<circle class="pt ${s>=GOAL?'ok':''}" cx="${X(i)}" cy="${Y(s)}" r="${i===N-1?6:4}"/>`;
      if(i%step === 0 || i === N-1) body += `<text x="${X(i)}" y="${H-10}" text-anchor="middle">${i+1}</text>`;
    });
    const s = scores[N-1];
    body += `<text class="val" x="${X(N-1)}" y="${Math.max(12, Y(s)-12)}" text-anchor="middle">${fmt(s)}</text>`;
  }
  const lab = N ? 'Nota de cada ronda, la última fue ' + fmt(scores[N-1]) + ' sobre 10; objetivo ' + fmt(GOAL) : 'Gráfica vacía; objetivo ' + fmt(GOAL);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${lab}">${g}${body}<text x="${W-R}" y="${H-10}" text-anchor="end">ronda</text></svg>`;
}

/* ---------- Portada ---------- */
function renderHome(){
  const s = UI.subj, info = SUBJ[s], uids = Object.keys(info.units).map(Number);
  const pr = projection(s), seen = pr.seenN > 0;
  const totalQ = poolOf(s,'abc').length + poolOf(s,'dev').length;
  const secA = secPer(s,'abc');
  const studied = Store.sessions.filter(x => x.subj === s).reduce((a,x)=>a+x.sec,0);
  const stat = (label, val, sub) => `<div class="stat"><small>${label}</small><b>${val}</b><span>${sub}</span></div>`;
  const steps = r => !seen ? ['—','de tests repetidos'] : r === 0 ? ['Listo','ya estás en ese nivel'] :
    [r + (r===1?' test':' tests'), 'repetidos · ≈ ' + fmtMin(r*pr.total*secA/60)];
  const s95 = steps(pr.r95), s10 = steps(pr.r10);
  const rows = uids.map(u => {
    const sc = avg(poolOf(s,'abc').filter(x => x.u === u).map(pOf))*10;
    return `<div class="urow"><span>UD0${u} · ${info.units[u]}</span><i class="bar"><b style="width:${sc*10}%"></b></i><em>${fmt(sc)}</em></div>`;
  }).join('');
  const scD = avg(poolOf(s,'dev').map(pOf))*10;
  const rowD = `<div class="urow"><span>Desarrollo · todas las unidades</span><i class="bar"><b style="width:${scD*10}%"></b></i><em>${fmt(scD)}</em></div>`;

  const base = poolOf(s, UI.tipo), sel = UI.units[s];
  const inSel = base.filter(x => sel.includes(x.u));
  const weak = inSel.filter(x => pOf(x) < WEAK), fresh = inSel.filter(x => !Store.q[x.id]);
  const n = UI.mode === 'exam' ? Math.min(EXAM_N, inSel.length) : UI.mode === 'weak' ? weak.length : UI.mode === 'new' ? fresh.length : inSel.length;
  const est = n * secPer(s, UI.tipo) / 60;
  const chips = uids.map(u => `<button type="button" class="pill" data-act="unit" data-v="${u}" aria-pressed="${sel.includes(u)}">UD0${u} · ${base.filter(x => x.u === u).length}</button>`).join('');
  const modes = [['exam','Examen',UI.tipo==='dev'], ['all','Todas'], ['weak','Flojas ('+weak.length+')'], ['new','Nuevas ('+fresh.length+')']];

  const sc = Store.sessions.filter(x => x.subj === s && x.n >= MIN_Q).map(x => x.ok/x.n*10);
  const where = Store.kind === 'db' ? 'El progreso se guarda en tu cuenta y solo lo ves tú.' : Store.kind === 'local' ? 'El progreso se guarda en este navegador.' : 'El progreso solo dura mientras tengas esta página abierta.';

  root.innerHTML = `
  <div class="top"><div><h1>${info.name}</h1><p class="sub">${totalQ} preguntas · ${uids.length} unidades</p></div>
    ${seg('subj', Object.keys(SUBJ).map(k => [k, SUBJ[k].name]), s)}</div>

  <section class="card"><h2>Tu proyección</h2>
    <div class="stats">
      ${stat('Nota en el examen', seen ? fmt(pr.score) : '—', seen ? 'de media en un examen de ' + pr.k : 'haz un test para calcularla')}
      ${stat('Prob. de sacar 10', seen ? pct(pr.p10) : '—', pr.k + '/' + pr.k + ' en el examen')}
      ${stat('Para llegar al ' + fmt(GOAL), s95[0], s95[1])}
      ${stat('Para llegar al 10', s10[0], s10[1])}
    </div>
    <p class="meta">Examen de ${pr.k} preguntas de las ${uids.length} unidades mezcladas · estudiado ${fmtStudied(studied)} · ${pr.seenN}/${pr.total} preguntas vistas · ${secA} s por pregunta</p>
    <div class="units">${rows}${rowD}</div>
  </section>

  <section class="card"><h2>Nuevo test</h2>
    ${seg('tipo', [['abc','Test ABC'],['dev','Desarrollo']], UI.tipo)}
    <div class="pills">${chips}</div>
    ${seg('mode', modes, UI.mode)}
    <p class="meta">${n} preguntas · orden y respuestas mezclados en cada repetición · ≈ ${fmtMin(est)}</p>
    <button type="button" class="btn" data-act="start" ${n ? '' : 'disabled'}>Empezar</button>
  </section>

  <section class="card"><h2>Tu evolución</h2>${chartSvg(sc)}
    <p class="meta">Cada punto es una ronda de ${MIN_Q} o más preguntas. La línea verde es tu objetivo, un ${fmt(GOAL)}.</p></section>

  <details class="card" id="det" ${UI.detOpen ? 'open' : ''}><summary>¿Cómo se calculan la nota y las horas?</summary>
    <div class="expl" style="margin-top:12px">
      <p><b>Dominio de cada pregunta.</b> Empieza en 1/3, que es adivinar entre A, B y C. Cada vez que la respondes, el nuevo valor es la media entre el anterior y tu resultado (1 si aciertas, 0 si fallas). Un fallo baja mucho y los aciertos seguidos lo acercan a 1.</p>
      <p><b>Nota en el examen.</b> Es la media del dominio de las preguntas de test de la asignatura, por 10. La probabilidad de sacar 10 es esa media elevada a ${pr.k}, las preguntas del examen.</p>
      <p><b>Para llegar al ${fmt(GOAL)} y al 10.</b> Cuenta cuántas pasadas completas por todo el test hacen falta si aciertas todo, porque cada pasada reduce a la mitad lo que te falta. Es un mínimo: los fallos lo alargan. Llegar al 10 significa tener al menos un 50 % de probabilidad de sacar 10. Las horas son pasadas × preguntas × tus segundos por pregunta (15 s hasta que haya datos).</p>
      <p><b>Flojas y nuevas.</b> Flojas son las preguntas con dominio por debajo de 0,9. Nuevas son las que nunca has respondido.</p>
      <p><b>Desarrollo.</b> Cuenta como acertada si marcas "la sabía". No entra en la nota del examen, que usa solo el test.</p>
      <div class="row">${Store.confirmDel
        ? '<button type="button" class="btn warn small" data-act="delYes">Sí, borrar todo</button><button type="button" class="btn ghost small" data-act="delNo">Cancelar</button>'
        : (Store.sessions.length || Object.keys(Store.q).length ? '<button type="button" class="btn ghost small" data-act="delAsk">Borrar mi historial</button>' : '')}</div>
    </div>
  </details>`;
  document.getElementById('foot').textContent = where + ' Preguntas basadas en tus apuntes de WordPress y de ERP.' + (Store.err ? ' No se pudo guardar el último cambio.' : '');
}

/* ---------- Ejecución de un test ---------- */
function startRun(list, mode){
  list = shuffle(list.slice());
  if(mode === 'exam') list = list.slice(0, EXAM_N);
  const pos = shuffle(list.map((_,i) => i % 3));
  const opts = list.map((x,i) => {
    if(UI.tipo !== 'abc') return null;
    const o = shuffle(x.w.slice()); o.splice(pos[i], 0, x.c); return {o, p: pos[i]};
  });
  RUN = {list, opts, i:0, res:[], picked:null, mode, tipo:UI.tipo, subj:UI.subj, sec:0, qt:Date.now(), saved:false, before:projection(UI.subj).score, revealed:false};
  render(); window.scrollTo({top:0});
}
function record(x, ok, extra){
  const prev = Store.q[x.id] ? Store.q[x.id].p : PRIOR;
  Store.q[x.id] = {p: (prev + (ok ? 1 : 0))/2, n: (Store.q[x.id] ? Store.q[x.id].n : 0) + 1, t: Date.now()};
  RUN.sec += Math.min(120, Math.round((Date.now() - RUN.qt)/1000));
  RUN.res.push(Object.assign({x, ok}, extra || {}));
  persist();
}
function endRun(){
  const R = RUN;
  if(R && !R.saved && R.res.length){
    R.saved = true;
    Store.sessions.push({ts:Date.now(), n:R.res.length, ok:R.res.filter(r => r.ok).length, mode:R.mode, subj:R.subj, tipo:R.tipo, sec:R.sec});
    if(Store.sessions.length > 300) Store.sessions.shift();
    persist();
  }
}
function runHead(){
  const R = RUN, n = R.list.length;
  const okN = R.res.filter(r => r.ok).length;
  return `<div class="topbar"><button type="button" class="link" data-act="exit">← Salir</button><span>${MODE_LABEL[R.mode]} · ${SUBJ[R.subj].name}</span></div>
    <div class="progress"><div class="progress-top"><span>Pregunta ${Math.min(R.i+1, n)} de ${n}</span><span>${R.mode === 'exam' ? '' : okN + ' acertadas'}</span></div>
    <i class="bar"><b style="width:${R.i/n*100}%"></b></i></div>`;
}
function renderRun(){
  const R = RUN;
  if(R.i >= R.list.length) return renderSummary();
  const x = R.list[R.i], info = SUBJ[R.subj];
  const tag = `<span class="tag">UD0${x.u} · ${esc(info.units[x.u])}</span>`;
  if(R.tipo === 'abc'){
    const ob = R.opts[R.i], answered = R.picked !== null, fb = R.mode !== 'exam';
    const opts = ob.o.map((t,k) => {
      let cls = '';
      if(answered){ if(fb){ if(k === ob.p) cls = 'ok'; else if(k === R.picked) cls = 'bad'; } else if(k === R.picked) cls = 'sel'; }
      return `<button type="button" class="opt ${cls}" data-act="opt" data-v="${k}" ${answered ? 'disabled' : ''}><span class="l">${LET[k]}</span><span class="t">${esc(t)}</span></button>`;
    }).join('');
    let extra = '';
    if(answered){
      const good = R.picked === ob.p;
      extra = (fb ? `<div class="fb ${good?'ok':'bad'}" role="status"><strong>${good ? 'Correcto' : 'Incorrecto, la respuesta es la ' + LET[ob.p]}</strong><p>${esc(x.e)}</p></div>` : '') +
        `<div class="row"><button type="button" class="btn" data-act="next" style="padding:11px 22px;font-size:.95rem">${R.i+1 === R.list.length ? 'Ver resultado' : 'Siguiente'}</button></div>`;
    }
    root.innerHTML = runHead() + `<section class="card">${tag}<h2 class="q">${esc(x.q)}</h2><div class="opts">${opts}</div>${extra}</section>`;
    const nx = root.querySelector('[data-act="next"]'); if(nx) nx.focus();
  } else {
    root.innerHTML = runHead() + `<section class="card">${tag}<h2 class="q">${esc(x.q)}</h2>
      <label for="ans" class="hint">Escribe tu respuesta con tus palabras y luego compárala con el modelo.</label>
      <textarea id="ans" placeholder="Tu respuesta..."></textarea>
      <div class="row"><button type="button" class="btn" data-act="reveal" style="padding:11px 22px;font-size:.95rem">Ver respuesta modelo</button></div>
      <div id="model" hidden>
        <div class="model"><h3>Respuesta modelo</h3><p>${esc(x.a)}</p><h3>Ideas clave en tu respuesta</h3><div class="chips" id="chips"></div></div>
        <p class="hint" style="margin:12px 0 10px">¿La tenías?</p>
        <div class="row"><button type="button" class="btn good" data-act="yes" style="padding:11px 22px;font-size:.95rem">Sí, la sabía</button><button type="button" class="btn warn" data-act="no" style="padding:11px 22px;font-size:.95rem">Tengo que repasarla</button></div>
      </div></section>`;
  }
}
function renderSummary(){
  const R = RUN; endRun();
  const n = R.res.length, ok = R.res.filter(r => r.ok).length, nota = ok/n*10, fails = R.res.filter(r => !r.ok);
  const after = projection(R.subj).score;
  const line = R.tipo === 'abc' ? `Tu nota estimada en el examen pasa de ${fmt(R.before)} a ${fmt(after)}.` : 'Las respuestas de desarrollo no entran en la nota del examen.';
  const rev = fails.length ? '<h2>Para repasar</h2><div class="review">' + fails.map(r => R.tipo === 'abc'
    ? `<div><b>${esc(r.x.q)}</b>${r.pickText ? `<small class="no">Tu respuesta: ${esc(r.pickText)}</small>` : ''}<small>Correcta (${r.letter}): ${esc(r.x.c)}</small></div>`
    : `<div><b>${esc(r.x.q)}</b><small>${esc(r.x.a)}</small></div>`).join('') + '</div>' : '';
  root.innerHTML = `<div class="topbar"><button type="button" class="link" data-act="home">← Volver al inicio</button><span>${MODE_LABEL[R.mode]} · ${SUBJ[R.subj].name}</span></div>
    <section class="card"><span class="tag">Resultado</span><div class="score">${fmt(nota)}</div>
      <p class="meta" style="font-size:1rem;color:var(--fg)">${ok} de ${n} acertadas. ${line}</p>
      <div class="row"><button type="button" class="btn" data-act="home" style="padding:11px 22px;font-size:.95rem">Volver al inicio</button>
      ${fails.length ? '<button type="button" class="btn ghost" data-act="again" style="padding:11px 22px;font-size:.95rem">Repetir las falladas</button>' : ''}</div>${rev}</section>`;
  window.scrollTo({top:0});
}
function render(){
  if(!Store.ready){ root.innerHTML = '<section class="card"><h2>Cargando tu progreso...</h2></section>'; return; }
  RUN ? renderRun() : renderHome();
}

/* ---------- Eventos ---------- */
root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v, R = RUN;
  if(a === 'subj'){ UI.subj = v; render(); }
  else if(a === 'tipo'){ UI.tipo = v; if(v === 'dev' && UI.mode === 'exam') UI.mode = 'all'; render(); }
  else if(a === 'unit'){
    const u = +v, cur = UI.units[UI.subj], i = cur.indexOf(u);
    if(i >= 0){ if(cur.length > 1) cur.splice(i,1); } else cur.push(u);
    render();
  }
  else if(a === 'mode'){ UI.mode = v; render(); }
  else if(a === 'start'){
    const inSel = poolOf(UI.subj, UI.tipo).filter(x => UI.units[UI.subj].includes(x.u));
    const list = UI.mode === 'weak' ? inSel.filter(x => pOf(x) < WEAK) : UI.mode === 'new' ? inSel.filter(x => !Store.q[x.id]) : inSel;
    if(list.length) startRun(list, UI.mode);
  }
  else if(a === 'opt'){
    const k = +v, ob = R.opts[R.i];
    record(R.list[R.i], k === ob.p, {letter: LET[ob.p], pickText: ob.o[k]});
    R.picked = k; render();
  }
  else if(a === 'next'){ R.i++; R.picked = null; R.qt = Date.now(); render(); window.scrollTo({top:0}); }
  else if(a === 'reveal'){
    const x = R.list[R.i], txt = norm(document.getElementById('ans').value);
    document.getElementById('chips').innerHTML = x.k.map(k => { const hit = txt.includes(norm(k)); return `<span class="chip ${hit?'hit':''}">${hit?'✓ ':''}${esc(k)}</span>`; }).join('');
    document.getElementById('model').hidden = false;
    b.hidden = true; document.getElementById('ans').readOnly = true;
  }
  else if(a === 'yes' || a === 'no'){ record(R.list[R.i], a === 'yes'); R.i++; R.qt = Date.now(); render(); window.scrollTo({top:0}); }
  else if(a === 'exit' || a === 'home'){ endRun(); RUN = null; render(); window.scrollTo({top:0}); }
  else if(a === 'again'){ const fl = R.res.filter(r => !r.ok).map(r => r.x); endRun(); UI.tipo = R.tipo; UI.subj = R.subj; startRun(fl, 'redo'); }
  else if(a === 'delAsk'){ Store.confirmDel = true; UI.detOpen = true; render(); }
  else if(a === 'delNo'){ Store.confirmDel = false; render(); }
  else if(a === 'delYes'){ Store.confirmDel = false; Store.sessions = []; Store.q = {}; persist(); render(); }
});
root.addEventListener('toggle', e => { if(e.target && e.target.id === 'det') UI.detOpen = e.target.open; }, true);

render();
initStore();
</script>
</body>
